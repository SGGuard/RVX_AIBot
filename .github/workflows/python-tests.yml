name: Python Tests & Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      ADMIN_TOKEN: test-ci-admin-token
      TELEGRAM_BOT_TOKEN: test-ci-bot-token
      BOT_API_KEY: test-ci-api-key
      GEMINI_API_KEY: test-ci-gemini-key
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
      continue-on-error: false
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Check imports
      run: |
        python << 'EOF'
        critical_modules = ['groq', 'mistralai', 'fastapi', 'telegram']
        missing = []
        
        for module in critical_modules:
            try:
                __import__(module)
                print(f"✅ {module} available")
            except ImportError:
                print(f"⚠️  {module} not available")
                missing.append(module)
        
        if missing:
            print(f"\nNote: {len(missing)} package(s) missing - checking requirements.txt...")
            with open('requirements.txt', 'r') as f:
                req_content = f.read()
                for m in missing:
                    if m in req_content:
                        print(f"  {m} is in requirements.txt ✅")
        else:
            print("\n✅ All critical modules available")
        EOF
    
    - name: Verify critical files
      run: |
        python << 'EOF'
        import os
        
        required_files = [
            'bot.py',
            'api_server.py', 
            'ai_dialogue.py',
            'requirements.txt',
            '.env.example',
        ]
        
        print("🔍 Verifying critical files...")
        for file in required_files:
            if os.path.exists(file):
                print(f"  ✅ {file}")
            else:
                print(f"  ❌ {file} MISSING!")
                exit(1)
        
        # Check requirements.txt has critical dependencies
        with open('requirements.txt', 'r') as f:
            content = f.read()
            critical = ['fastapi', 'python-telegram-bot', 'httpx', 'groq', 'mistralai']
            for dep in critical:
                if dep in content:
                    print(f"  ✅ {dep} in requirements.txt")
                else:
                    print(f"  ❌ {dep} MISSING from requirements.txt!")
                    exit(1)
        
        print("\n✅ All checks passed!")
        EOF

  required-tests:
    name: Required focused tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov

    - name: Run required tests
      env:
        ENVIRONMENT: development
        ADMIN_TOKEN: test-ci-admin-token
        TELEGRAM_BOT_TOKEN: test-ci-bot-token
        BOT_API_KEY: test-ci-api-key
        GEMINI_API_KEY: test-ci-gemini-key
      run: >-
        pytest -q --tb=short
        tests/test_config_api_url.py
        tests/test_start_script.py
        tests/test_api_authentication.py
        tests/test_api_server_authorization.py
        tests/test_production_security_defaults.py
        tests/test_migrate_database_preservation.py
        tests/test_phase5_database_migrations.py::TestAlterTableMigrations
        tests/test_phase5_database_migrations.py::TestCheckColumnExists

  quality:
    name: Code quality (changed Python)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install quality tools
      run: python -m pip install black flake8 pyyaml

    - name: Validate Docker Compose configuration
      run: python .github/scripts/check_docker_compose.py

    - name: Check patch whitespace
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: git diff --check "$BASE_SHA"

    - name: Check formatting and lint on changed Python lines
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: python .github/scripts/check_changed_python_quality.py

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit
    
    - name: Run security checks
      run: |
        echo "🔒 Running Bandit security scan..."
        bandit -r *.py -ll
    
    - name: Check dependencies for vulnerabilities
      if: always()
      run: |
        echo "🔒 Auditing declared dependencies..."
        pip-audit -r requirements.txt
