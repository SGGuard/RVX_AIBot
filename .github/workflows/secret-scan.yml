name: Secret Scanning

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan secrets in files and Git history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history and refs
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan all reachable Git history
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.2
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git . --redact --verbose --exit-code 1 --log-opts=--all
